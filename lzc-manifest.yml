application:
  subdomain: hamsterbase-tasks
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://hamsterbase-tasks:3000/

services:
  hamsterbase-tasks:
    # upstream: hamsterbase/tasks:2025.09.2500
    image: hamsterbase/tasks:2025.09.2500
    binds:
      - /lzcapp/var/data:/app/data
