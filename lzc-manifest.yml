application:
  subdomain: hamsterbase-tasks
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://hamsterbase-tasks:3000/
services:
  hamsterbase-tasks:
    # upstream: hamsterbase/tasks:2025.10.1300
    image: registry.lazycat.cloud/czyt/hamsterbase/tasks:e1d461c0c1ba419e
    binds:
      - /lzcapp/var/data:/app/data
